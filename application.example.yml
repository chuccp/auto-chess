# auto-chess 配置示例
# 复制为 application.yml 后按需修改；application.yml 含数据库密码，已被 git 忽略。
web:
  server:
    port: 8090
    contextPath: auto-chess
    max_body_size: 1048576 # 1 MiB，棋盘请求足够
    read_timeout: 30
  # 配置 web.db 后反馈写入数据库；服务启动时自动创建 feedback 表。
  db:
    type: mysql
    host: 127.0.0.1
    port: 3306
    database: auto_chess
    user: root
    password: "change-me"
    max_open_conns: 20
    max_idle_conns: 10
    conn_max_lifetime: 3600
    # SQLite 示例（不使用 MySQL 时可改为下面两行）：
    # type: sqlite
    # path: data/auto-chess.db
  log:
    level: info
feedback:
  # 未配置 web.db 或数据库不可用时，反馈会追加写入该文件
  file: data/feedback.jsonl
engine:
  xiangqi:
    # 官方 Pikafish 2024-03-10 NNUE；不存在时自动回退 godogpaw
    nnue: pikafish.nnue
