{{define "nav"}}<header class="topbar">
  <a class="brand" href="/" aria-label="auto-chess 首页">
    <span class="brand-mark">♞</span>
    <span class="brand-text">auto-chess<small>AI MOVE API</small></span>
  </a>
  <button class="nav-toggle" id="nav-toggle" type="button" aria-label="展开导航" aria-expanded="false">☰</button>
  <nav class="nav" id="site-nav" aria-label="页面导航">
    <a href="/" class="nav-link {{if eq .Active "home"}}active{{end}}">首页</a>
    <a href="/guide" class="nav-link {{if eq .Active "guide"}}active{{end}}">快速开始</a>
    <a href="/docs" class="nav-link {{if eq .Active "docs"}}active{{end}}">接口</a>
    <a href="/docs/stream" class="nav-link {{if eq .Active "stream"}}active{{end}}">流式</a>
    <a href="/games" class="nav-link {{if eq .Active "games"}}active{{end}}">棋种</a>
    <a href="/play" class="nav-link {{if eq .Active "play"}}active{{end}}">对弈</a>
    <a href="/playground" class="nav-link {{if eq .Active "playground"}}active{{end}}">调试</a>
    <a href="/feedback" class="nav-link {{if eq .Active "feedback"}}active{{end}}">反馈</a>
  </nav>
  <div class="nav-tools">
    <a class="lang-btn" href="{{.LangURL}}" hreflang="{{.OtherLang}}" data-i18n-ignore title="Switch language / 切换语言">{{if eq .Lang "en"}}中文{{else}}EN{{end}}</a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换主题" title="切换亮色 / 深色主题">
      <span id="theme-icon" aria-hidden="true">☾</span>
    </button>
  </div>
  <div class="service-status" id="service-status" title="服务状态">
    <span class="dot"></span><span class="status-text">检测中</span>
  </div>
</header>{{end}}
